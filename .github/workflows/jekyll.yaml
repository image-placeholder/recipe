# This workflow builds and deploys the Jekyll site to GitHub Pages.
name: Deploy Jekyll Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js environment
        uses: actions/setup-node@v2
        with:
          node-version: '20'
 
      - name: Running Pre-build tasks
        run: |
          chmod +x _build/sh/preBuild.sh
          ./_build/sh/preBuild.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    


      - name: Build with Jekyll
        run: bundle exec jekyll clean && bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          NODE_PATH: ${{ github.workspace }}/node_modules

      - name: Running Post-Build tasks
        run: |
          chmod +x _build/sh/postBuild.sh
          ./_build/sh/postBuild.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    

      - name: Compress Images
        uses: MarketingPipeline/Image-Optimizer-Action@main
        with:
          filename: _site/
          recursion: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
        # Specify the target branch for GitHub Pages deployment
            branch: gh-pages
        # Specify the directory containing the built static files
            folder: _site  # Or the folder where your Jekyll build output is stored
            clean: true
