{% assign base_url = site.baseurl | default: "" %}
<style> body { font-family: 'Inter', sans-serif; background-color: #f8f7f2; } h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
    /* Premium Navigation Blur */
    .glass-nav { background-color: rgba(248, 247, 242, 0.8); backdrop-filter: blur(8px); }

    /* Print optimization to hide URL and Page # */
    @media print {
        @page { margin: 0; }
        body { margin: 2cm; background: white !important; color: black !important; }
        nav, footer, button, .no-print { display: none !important; }
    }
</style>
<div id="menu-overlay" class="fixed inset-0 bg-stone-900/20 backdrop-blur-sm z-60 hidden opacity-0 transition-opacity duration-500"></div>

<nav class="border-b border-stone-200 py-6 px-6 sticky top-0 z-50 glass-nav transition-all duration-300" id="main-nav">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    
    <a href="{{ '/' | relative_url }}" class="text-center md:text-left no-underline group">
      <h1 class="text-xl tracking-[0.2em] font-bold uppercase italic text-stone-800 transition-colors group-hover:text-stone-500">{{site.title}}</h1>
      <p class="text-[9px] tracking-[0.2em] uppercase opacity-60 text-stone-600">The Digitized Church Ledger • South Huron, ON</p>
    </a>

    <button id="menu-toggle" aria-label="Toggle navigation" class="group relative h-10 w-10 flex items-center justify-center z-50">
      <div class="flex flex-col justify-between h-[12px] w-[20px] transform transition-all duration-300">
        <span id="line-1" class="h-px w-full bg-stone-800 transition-all duration-300 origin-right"></span>
        <span id="line-2" class="h-px w-full bg-stone-800 transition-all duration-300"></span>
        <span id="line-3" class="h-px w-full bg-stone-800 transition-all duration-300 origin-right"></span>
      </div>
    </button>
  </div>
</nav>

<aside id="mobile-menu" class="fixed top-0 right-0 h-full w-full sm:w-80 bg-stone-50 text-stone-800 shadow-2xl transform translate-x-full transition-transform duration-500 ease-in-out z-50 border-l border-stone-200">
  <div class="flex flex-col h-full">
    
   <!--    <div class="p-8 flex justify-end">
      </div> -->

   <!-- Header / Close -->
<div class="p-4 flex justify-end">
  <button
    aria-label="Close menu"
    class="group flex items-center gap-2 text-stone-500 hover:text-stone-800 transition-colors"
    data-close-btn>

    <span class="uppercase tracking-[0.35em] text-[9px] font-bold">
      Close
    </span>

    <span class="relative h-4 w-4">
      <span class="absolute top-1/2 left-0 w-full h-px bg-current rotate-45"></span>
      <span class="absolute top-1/2 left-0 w-full h-px bg-current -rotate-45"></span>
    </span>

  </button>
</div>


    <div class="px-10 mb-4">  
    <!---<div class="px-10 mb-8"> -->
     <!-- <span class="uppercase tracking-[0.4em] text-[9px] font-bold text-stone-400 mb-4 block">Search Ledger</span>--->
      <div class="relative">
        <input 
          type="text" 
          id="menu-search"
          placeholder="Search recipes or records..." 
          class="w-full bg-transparent border-b border-stone-200 py-3 focus:outline-none focus:border-stone-800 transition-colors serif text-lg italic text-stone-800 placeholder:text-stone-300 placeholder:italic"
        >
        <button class="absolute right-0 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-800 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
      </div>
    </div>

    <nav class="px-10 pb-10 overflow-y-auto">
      <span class="uppercase tracking-[0.4em] text-[9px] font-bold text-stone-400 mb-10 block border-b border-stone-200 pb-2">Navigation</span>
      <ul class="space-y-6">
        <li><a href="{{ '/' | relative_url }}" class="block serif text-3xl hover:pl-2 transition-all duration-300 hover:text-stone-500">Home</a></li>
        <li><a href="{{ '/about/' | relative_url }}" class="block serif text-3xl hover:pl-2 transition-all duration-300 hover:text-stone-500">About</a></li>
        <li><a href="{{ '/recipes/' | relative_url }}" class="block serif text-3xl hover:pl-2 transition-all duration-300 hover:text-stone-500">Recipes</a></li>
        <li><a href="{{ '/search-recipes/' | relative_url }}" class="block serif text-3xl hover:pl-2 transition-all duration-300 hover:text-stone-500">Search Recipes</a></li>
      </ul>
    </nav>

    <div class="mt-auto p-10 bg-stone-100 border-t border-stone-200">
      <div class="flex flex-col gap-4">
        <a href="{{ '/support-us/' | relative_url }}" class="uppercase tracking-[0.3em] text-[10px] font-bold text-stone-500 hover:text-stone-800 transition-colors no-underline">Support Us</a>
        <a href="{{ '/founder/' | relative_url }}" class="uppercase tracking-[0.3em] text-[10px] font-bold text-stone-500 hover:text-stone-800 transition-colors no-underline">Meet The Founder</a>
      </div>
    </div>
  </div>
</aside>
