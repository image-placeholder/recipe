<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Fix for height issues in headless browsers */
    .canvas { width: 1200px; height: 630px; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-900 text-white">
  <div class="canvas relative flex flex-col justify-between p-20 border-b-[20px] border-indigo-500">
    
    <div class="absolute top-0 right-0 -mt-20 -mr-20 w-96 h-96 bg-indigo-600 rounded-full blur-[120px] opacity-20"></div>

    <div class="z-10">
      <p class="text-indigo-400 font-bold tracking-widest uppercase mb-4">{{ site.title }}</p>
      <h1 class="text-7xl font-bold leading-tight">
        {{ title }}
      </h1>
    </div>

    <div class="z-10 flex items-center justify-between">
      <div class="flex items-center gap-4">
        {% if site.logo_text %}
        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-slate-900 font-black">
          {{ site.logo_text }}
        </div>
        {% else %}
        
        {% endif %}

        {% if page.slug %}
        <span class="text-2xl text-slate-400">/{{ page.path }}/{{ page.slug }}</span>
        {% endif %}
      </div>
      <p class="text-xl text-slate-500">{{ page.date | date: "%B %d, %Y" }}</p>
    </div>
  </div>
</body>
</html>
