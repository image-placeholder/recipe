<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .serif { font-family: 'Playfair Display', serif; }
    .sans { font-family: 'Inter', sans-serif; }
    /* OG Image Standard Dimensions */
    .canvas { width: 1200px; height: 630px; overflow: hidden; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800">
  <div class="canvas relative flex flex-col justify-between p-24 border-b-[16px] border-stone-200">
    
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');"></div>

    <div class="z-10">
      <div class="flex items-center gap-4 mb-8">
        <div class="w-12 h-px bg-stone-300"></div>
        <p class="sans text-stone-400 font-bold tracking-[0.4em] uppercase text-sm">
          {{ site.title }}
        </p>
      </div>
      
      <h1 class="serif text-8xl leading-tight text-stone-900">
        {{ title | default: "Untitled" }}
      </h1>

 
       <p class="serif italic text-4xl text-stone-500 mt-6 font-light">
        {{ page.description }}
        
      </p> 
      
  
 

    </div>

    <div class="z-10 flex items-end justify-between border-t border-stone-200 pt-12">
      <div class="flex flex-col gap-2">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 border border-stone-800 flex items-center justify-center text-[10px] font-bold">{{site.logo_text}}</div>
            <span class="sans text-xl font-bold tracking-widest text-stone-800 uppercase">
                Recipe Archive
            </span>
        </div>
        <p class="sans text-stone-400 text-lg uppercase tracking-widest">
            /{{ path }}/{{ page.slug }}
        </p>
      </div>

      <div class="bg-stone-800 text-white px-10 py-5">
        <p class="sans text-sm font-bold uppercase tracking-[0.3em]">
          View Recipe &rarr;
        </p>
      </div>
    </div>

  </div>
</body>
</html>
